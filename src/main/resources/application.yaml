spring:
  application:
    name: userauthentication
  datasource:
    url: 'jdbc:h2:mem:userdb'
    driverClassName: org.h2.Driver
    username: sa
    password: password
    platform: h2
  h2:
    console:
      enabled: true
      path: /h2-console
  modulith:
    events:
      enabled: true
---
management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: "/actuator"
  endpoint:
    env:
      enabled: true
    info:
      enabled: true
    health:
      show-details: always
    modulith:
      enabled: true
---
logging:
  structured:
    format:
      console:

